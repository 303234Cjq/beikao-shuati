<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>周测 · 预测卷</title>
<script>
window.MathJax={tex:{inlineMath:[['$','$']],displayMath:[['$$','$$']]},svg:{fontCache:'global'}};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
*{box-sizing:border-box}
:root{--bg:#f3f6fa;--card:#fff;--ink:#182437;--muted:#6b7683;--line:#e2e8f0;--acc:#1f4e79;--ok:#1f7a3d;--bad:#b91c1c;--warn:#b45309}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"PingFang SC",system-ui,sans-serif}
main{max-width:820px;margin:auto;padding:16px 14px 100px}
h1{font-size:20px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.paper{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin:9px 0;background:var(--card)}
.paper b{font-size:15px}
.meta{color:var(--muted);font-size:12.5px}
a.btn,button.btn{display:inline-block;background:var(--acc);color:#fff;border:0;text-decoration:none;padding:9px 15px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
button.ghost{background:#eef4fa;color:var(--acc);border:1px solid #dbe6f2}
.q{border-bottom:1px solid var(--line);padding:12px 0}
.q:last-child{border-bottom:0}
.qh{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.tag{background:#eef4fa;color:var(--acc);border-radius:999px;padding:1px 9px;font-size:12px}
.tag.ee{background:#fdf1e7;color:var(--warn)}
.stem{font-size:15px;margin:4px 0 8px}
label.opt{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;font-size:14px}
label.opt input{margin-top:5px;accent-color:var(--acc)}
label.opt.right{border-color:#b9dfc6;background:#f2fbf5}
label.opt.wrong{border-color:#f2c4c4;background:#fdf3f3}
.sol{background:#f7fafc;border-left:3px solid var(--acc);padding:9px 12px;border-radius:8px;margin-top:8px;font-size:13.5px}
.sol p{margin:4px 0}
.hidden{display:none}
.topbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;justify-content:center;align-items:center;backdrop-filter:blur(8px)}
.big{font-size:26px;font-weight:700}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:8px 0}
.res div{background:#f7fafc;border-radius:10px;padding:8px}
.hist{font-size:13px;color:var(--muted)}
</style></head><body><main>
<h1>周测 · 预测卷</h1>
<div class="card" id="intro">
  <div class="meta">4 套周测（各 20 题 / 100 分 / 60 分钟）+ 2 套预测卷（各 40 题 / 100 分 / 150 分钟）。交卷后自动判分并给出解析。<br>本卷全部为选择题（可自动判分）；计算题的书写训练请回刷题站「真题 / 题型专项」模块。</div>
</div>
<div id="list"></div>
<div class="card hist" id="hist" style="display:none"></div>

<div id="run" class="hidden">
  <div class="card" style="position:sticky;top:0;z-index:5;border-radius:0 0 14px 14px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <b id="runTitle"></b><span class="big" id="clock">--:--</span>
    </div>
    <div class="meta" id="runMeta"></div>
  </div>
  <div id="qs"></div>
</div>

<div id="result" class="hidden"></div>
</main>
<div class="topbar hidden" id="bar">
  <button class="btn" id="submitBtn">交卷</button>
  <button class="btn ghost" id="quitBtn">退出</button>
</div>

<script>
(function(){
  var LS='papers_v1', cfg={history:[]};
  try{Object.assign(cfg,JSON.parse(localStorage.getItem(LS)||'{}'));}catch(e){}
  var papers=[], cur=null, answers={}, timer=null, left=0, submitted=false;
  var $=function(id){return document.getElementById(id);};

  function fmt(sec){var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
  function save(){try{localStorage.setItem(LS,JSON.stringify(cfg));}catch(e){}}

  function loadPapers(){
    fetch('papers.json?t='+Date.now()).then(function(r){return r.json();}).then(function(data){
      papers=data; renderList(); renderHistory();
    }).catch(function(){ $('intro').innerHTML='<div class="meta">papers.json 加载失败，请刷新重试。</div>'; });
  }

  function renderList(){
    var box=$('list'); box.innerHTML='';
    papers.forEach(function(p){
      var d=document.createElement('div'); d.className='paper';
      d.innerHTML='<div><b>'+p.title+'</b><div class="meta">'+p.total+' 题 · 满分 '+p.fullScore+
        ' · '+p.minutes+' 分钟 · 数学 '+p.mathCount+' / 电路 '+p.eeCount+'</div></div><button class="btn" data-p="'+p.id+'">开始</button>';
      box.appendChild(d);
    });
    box.addEventListener('click',function(e){
      var t=e.target.closest('button[data-p]'); if(!t)return; start(t.getAttribute('data-p'));
    });
  }

  function renderHistory(){
    if(!cfg.history||!cfg.history.length)return;
    var h=$('hist'); h.style.display='block';
    var rows=cfg.history.slice(-6).reverse().map(function(r){
      return '<div>'+r.date+' · '+r.title+'：<b>'+r.score+'</b> 分（'+r.right+'/'+r.total+'）</div>';
    }).join('');
    h.innerHTML='<b>最近成绩</b>'+rows;
  }

  function start(id){
    cur=papers.filter(function(p){return p.id===id;})[0]; if(!cur)return;
    answers={}; submitted=false; left=cur.minutes*60;
    $('list').innerHTML=''; $('intro').style.display='none';
    $('run').classList.remove('hidden'); $('bar').classList.remove('hidden'); $('result').classList.add('hidden');
    $('runTitle').textContent=cur.title;
    $('runMeta').textContent=cur.total+' 题 · 满分 '+cur.fullScore+' · 每题 '+cur.perScore+' 分';
    var box=$('qs'); box.innerHTML='';
    cur.questions.forEach(function(q,idx){
      var d=document.createElement('div'); d.className='q'; d.id='q'+idx;
      var tag=q.subject==='ee'?'<span class="tag ee">电路</span>':'<span class="tag">数学</span>';
      var h='<div class="qh">'+tag+'<span>第 '+(idx+1)+' 题</span><span>'+q.module+'</span></div>'+
            '<div class="stem">'+q.stem+'</div>';
      q.opts.forEach(function(o,oi){
        var L='ABCD'[oi];
        h+='<label class="opt"><input type="radio" name="q'+idx+'" value="'+L+'" data-q="'+idx+'"><span>'+o+'</span></label>';
      });
      d.innerHTML=h; box.appendChild(d);
    });
    box.onchange=function(e){
      if(e.target.type!=='radio')return;
      answers[e.target.getAttribute('data-q')]=e.target.value;
    };
    window.scrollTo(0,0);
    if(timer)clearInterval(timer);
    timer=setInterval(function(){
      left--; $('clock').textContent=fmt(Math.max(0,left));
      if(left<=0){clearInterval(timer); submit(true);}
    },1000);
    $('clock').textContent=fmt(left);
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();
  }

  function submit(auto){
    if(submitted||!cur)return;
    if(!auto){
      var unanswered=cur.total-Object.keys(answers).length;
      if(unanswered>0&&!confirm('还有 '+unanswered+' 题没答，确定交卷？'))return;
    }
    submitted=true; if(timer)clearInterval(timer);
    var right=0, wrongList=[];
    cur.questions.forEach(function(q,idx){
      var got=answers[idx], ok=got===q.answer;
      if(ok)right++; else wrongList.push({idx:idx,q:q,got:got});
      var el=$('q'+idx); if(!el)return;
      var labels=el.querySelectorAll('label.opt');
      labels.forEach(function(lb,i){
        var L='ABCD'[i];
        lb.querySelector('input').disabled=true;
        if(L===q.answer)lb.classList.add('right');
        else if(L===got)lb.classList.add('wrong');
      });
      var sol=document.createElement('div'); sol.className='sol';
      var txt=(q.solution||[]).map(function(s){return '<p>'+s+'</p>';}).join('');
      sol.innerHTML='<p><b>正确答案：'+q.answer+'</b>'+(got?'（你选 '+got+'）':'（未作答）')+'</p>'+(txt||'<p>（解析见刷题站原题）</p>');
      el.appendChild(sol);
    });
    var score=Math.round(right*cur.perScore*10)/10;
    var d=new Date();
    var ds=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    cfg.history=cfg.history||[]; cfg.history.push({date:ds,title:cur.title,score:score,right:right,total:cur.total});
    if(cfg.history.length>30)cfg.history=cfg.history.slice(-30);
    save();

    var r=$('result'); r.classList.remove('hidden');
    var pass=score>=60?'通过':'未达标';
    var cls=score>=60?'var(--ok)':'var(--bad)';
    r.innerHTML='<div class="card"><h1 style="margin:0">'+cur.title+'</h1>'+
      '<div class="res"><div><div class="meta">得分</div><div class="big" style="color:'+cls+'">'+score+'</div></div>'+
      '<div><div class="meta">正确</div><div class="big">'+right+'/'+cur.total+'</div></div>'+
      '<div><div class="meta">用时</div><div class="big">'+fmt(cur.minutes*60-Math.max(0,left))+'</div></div></div>'+
      '<p class="meta">'+pass+'（60 分为达标线，周测建议 70+，预测卷建议 65+）</p>'+
      '<button class="btn ghost" id="reviewBtn">查看逐题解析</button> <a class="btn" href="plan.html">回到打卡页</a></div>';
    r.scrollIntoView({block:'start'});
    $('bar').classList.add('hidden');
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();
    renderHistory();
    $('reviewBtn').onclick=function(){
      var first=wrongList[0];
      if(first)$('q'+first.idx).scrollIntoView({block:'center'});
      else window.scrollTo(0,0);
    };
  }

  $('submitBtn').onclick=function(){submit(false);};
  $('quitBtn').onclick=function(){
    if(!submitted&&!confirm('退出将丢弃本次作答，确定？'))return;
    if(timer)clearInterval(timer);
    $('run').classList.add('hidden'); $('bar').classList.add('hidden');
    $('intro').style.display='block'; location.reload();
  };
  loadPapers();
})();
</script></body></html>
