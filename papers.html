<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<title>周测 · 预测卷</title>
<script>
window.MathJax={tex:{inlineMath:[['$','$']],displayMath:[['$$','$$']]},svg:{fontCache:'global'}};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f2f5f9;--card:#fff;--ink:#15202e;--muted:#69738a;--line:#e3e9f0;--acc:#1f4e79;--acc2:#e8f1fa;--ok:#1a7f45;--bad:#b91c1c;--warn:#b45309;--r:14px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,"PingFang SC",sans-serif;padding-bottom:84px}
main{max-width:780px;margin:auto;padding:0 12px 16px}
.hdr{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);margin:0;padding:10px 14px;box-shadow:0 2px 10px rgba(21,32,46,.06)}
.hdr .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hdr b{font-size:14.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-variant-numeric:tabular-nums;font-size:19px;font-weight:700;color:var(--acc);letter-spacing:.02em}
.clock.low{color:var(--bad)}
.meta{font-size:12px;color:var(--muted);margin-top:2px}
.bar{height:5px;background:#e9eef5;border-radius:99px;margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
/* 卷子列表 */
.paper{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r);margin:9px 0;background:var(--card)}
.paper b{font-size:14.5px;display:block}
.paper .meta{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--acc);color:#fff;padding:11px 15px;border-radius:11px;font:inherit;font-size:14.5px;font-weight:500;cursor:pointer;text-decoration:none}
.btn.ghost{background:var(--acc2);color:var(--acc)}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin:10px 0}
.card h2{font-size:13.5px;margin:0 0 8px;color:var(--muted);font-weight:600}
.hist{font-size:13px;color:var(--muted);line-height:1.9}
.hist b{color:var(--ink)}
/* 答题区 */
.qwrap{padding:14px 2px 8px}
.qh{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-bottom:8px}
.tag{background:var(--acc2);color:var(--acc);border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:500}
.tag.ee{background:#fdf1e7;color:var(--warn)}
.tag.flag{background:#fdecec;color:var(--bad)}
.stem{font-size:15.5px;line-height:1.75;margin:2px 0 12px;overflow-wrap:anywhere}
.stem mjx-container{max-width:100%!important;overflow-x:auto;overflow-y:hidden}
.stem mjx-container[jax="CHTML"][display="true"]{overflow-x:auto;overflow-y:hidden}
label.opt{display:flex;gap:11px;align-items:flex-start;padding:13px;overflow-wrap:anywhere;border:1px solid var(--line);border-radius:12px;margin:9px 0;cursor:pointer;font-size:14.5px;background:#fbfcfe;transition:border-color .12s,background .12s}
label.opt input{position:absolute;opacity:0;pointer-events:none}
label.opt .k{flex:0 0 26px;width:26px;height:26px;border:1.5px solid #c6d2e0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--muted);background:#fff}
label.opt.sel{border-color:var(--acc);background:#f4f9fd;box-shadow:0 0 0 1px var(--acc) inset}
label.opt.sel .k{background:var(--acc);border-color:var(--acc);color:#fff}
label.opt.right{border-color:#9fd8b3;background:#f2fbf5}
label.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
label.opt.wrong{border-color:#efb9b9;background:#fdf4f4}
label.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.sol{overflow-wrap:anywhere;background:#f7fafc;border-left:3px solid var(--acc);padding:10px 12px;border-radius:9px;margin-top:10px;font-size:13.5px}
.sol p{margin:5px 0}
/* 底部操作条 */
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.98);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:8px;backdrop-filter:blur(10px)}
.actbar .btn{padding:12px 8px;font-size:14px}
/* 题号面板 */
.sheet{position:fixed;inset:0;background:rgba(15,23,35,.45);z-index:40;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .inner{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:76vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.n{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:#fbfcfe;font:inherit;font-size:14px;cursor:pointer;position:relative;color:var(--ink)}
.n.ans{background:var(--acc2);border-color:#cfe0ef;color:var(--acc);font-weight:600}
.n.flag::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--bad)}
.n.cur{outline:2px solid var(--acc);outline-offset:1px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
/* 结果 */
.score{font-size:44px;font-weight:800;line-height:1.1;text-align:center;margin:6px 0 2px}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:10px 0}
.res div{background:#f7fafc;border-radius:11px;padding:9px 4px}
.res span{display:block;font-size:12px;color:var(--muted)}
.res b{font-size:17px}
.wrongrow{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
.wrongrow:last-child{border-bottom:0}
/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(15,23,35,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;padding:18px;max-width:340px;width:100%}
.modal h3{margin:0 0 6px;font-size:16px}
.modal p{margin:0 0 14px;font-size:13.5px;color:var(--muted);line-height:1.6}
.modal .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hidden{display:none!important}
nav.tab{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.98);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tab a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11.5px;padding:6px 0}
nav.tab a b{font-size:19px;line-height:1;font-weight:400}
nav.tab a.on{color:var(--acc)}
</style></head><body>

<div class="hdr hidden" id="hdr">
  <div class="row">
    <div style="min-width:0"><b id="hTitle">—</b><div class="meta" id="hMeta"></div></div>
    <div style="text-align:right"><div class="clock" id="clock">00:00</div><div class="meta" id="hProg">0/0</div></div>
  </div>
  <div class="bar"><i id="hBar"></i></div>
</div>

<main id="home">
  <div class="card">
    <h2>选择一套开始</h2>
    <div class="meta" style="font-size:12.5px">周测 20 题 / 100 分 / 60 分钟 · 预测卷 40 题 / 100 分 / 150 分钟。交卷自动判分并展开解析。</div>
  </div>
  <div id="list"></div>
  <div class="card hist" id="hist" style="display:none"></div>
</main>

<main id="runner" class="hidden"><div class="qwrap" id="qwrap"></div></main>

<main id="result" class="hidden"></main>

<div class="actbar hidden" id="bar">
  <button class="btn line" id="prevBtn">上一题</button>
  <button class="btn ghost" id="paletteBtn">题号</button>
  <button class="btn" id="nextBtn">下一题</button>
</div>

<nav class="tab hidden" id="tab">
  <a href="plan.html"><b>◎</b>今日</a>
  <a href="papers.html" class="on"><b>▤</b>卷子</a>
  <a href="plan.html#formulas"><b>∑</b>公式</a>
  <a href="index.html"><b>✎</b>刷题</a>
</nav>

<div class="sheet" id="sheet"><div class="inner">
  <h3>题号导航</h3>
  <div class="meta" id="sheetMeta">点击题号跳转</div>
  <div class="grid" id="grid"></div>
  <div class="legend"><span><i style="background:#e8f1fa;border:1px solid #cfe0ef"></i>已答</span>
  <span><i style="background:#fbfcfe;border:1px solid #e3e9f0"></i>未答</span>
  <span><i style="background:#b91c1c;border-radius:50%"></i>标记</span></div>
  <button class="btn wide" id="closeSheet" style="margin-top:14px">收起</button>
</div></div>

<div class="modal" id="modal"><div class="box">
  <h3 id="mTitle">确认交卷</h3>
  <p id="mBody">还有 0 题未答。</p>
  <div class="acts"><button class="btn line" id="mCancel">继续答题</button><button class="btn" id="mOk">交卷</button></div>
</div></div>

<script>
(function(){
  var LS='papers_v2', cfg={history:[]};
  try{Object.assign(cfg,JSON.parse(localStorage.getItem(LS)||'{}'));}catch(e){}
  var papers=[], cur=null, answers={}, flags={}, pos=0, left=0, timer=null, submitted=false, subset=null;
  var $=function(id){return document.getElementById(id);};
  function z(n){return n<10?'0'+n:''+n;}
  function cleanOpt(o){return String(o).replace(/^\s*[A-DＡ-Ｄ]\s*[\.、．:：\)]\s*/,'');}
  function fmt(s){s=Math.max(0,s);return z(Math.floor(s/60))+':'+z(s%60);}
  function save(){try{localStorage.setItem(LS,JSON.stringify(cfg));}catch(e){}}

  fetch('papers.json?t='+Date.now()).then(function(r){return r.json();}).then(function(d){
    papers=d; renderList(); renderHist();
  }).catch(function(){ $('list').innerHTML='<div class="card">papers.json 加载失败，请刷新。</div>'; });

  function renderList(){
    var box=$('list'); box.innerHTML='';
    papers.forEach(function(p){
      var d=document.createElement('div'); d.className='paper';
      d.innerHTML='<div style="min-width:0"><b>'+p.title+'</b><div class="meta">'+p.total+' 题 · 满分 '+p.fullScore+' · '+p.minutes+' 分钟</div><div class="meta">数学 '+p.mathCount+' / 电路 '+p.eeCount+'</div></div><button class="btn" data-p="'+p.id+'">开始</button>';
      box.appendChild(d);
    });
  }
  function renderHist(){
    if(!cfg.history||!cfg.history.length)return;
    var h=$('hist'); h.style.display='block';
    h.innerHTML='<h2>最近成绩</h2>'+cfg.history.slice(-6).reverse().map(function(r){
      return '<div>'+r.date+' · '+r.title+' <b>'+r.score+'</b> 分（'+r.right+'/'+r.total+'）</div>';
    }).join('');
  }

  $('list').addEventListener('click',function(e){
    var t=e.target.closest('button[data-p]'); if(!t)return;
    start(t.getAttribute('data-p'), null);
  });

  function start(id, onlyWrong){
    cur=papers.filter(function(p){return p.id===id;})[0]; if(!cur)return;
    subset=onlyWrong; answers={}; flags={}; pos=0; submitted=false;
    var qs=cur.questions;
    if(subset){ qs=qs.filter(function(q,i){return subset.indexOf(i)>=0;}); cur={id:cur.id+'-retry',title:cur.title+'（只练错题）',minutes:Math.max(20,Math.ceil(cur.minutes*subset.length/cur.questions.length)),perScore:cur.perScore,fullScore:Math.round(subset.length*cur.perScore*10)/10,total:subset.length,questions:qs,mathCount:qs.filter(function(q){return q.subject==='math';}).length,eeCount:qs.filter(function(q){return q.subject==='ee';}).length}; }
    left=cur.minutes*60;
    $('home').classList.add('hidden'); $('result').classList.add('hidden');
    $('runner').classList.remove('hidden'); $('hdr').classList.remove('hidden');
    $('bar').classList.remove('hidden'); $('tab').classList.add('hidden');
    $('hTitle').textContent=cur.title;
    $('hMeta').textContent=cur.total+' 题 · 满分 '+cur.fullScore;
    if(timer)clearInterval(timer);
    timer=setInterval(function(){
      left--; $('clock').textContent=fmt(left);
      $('clock').classList.toggle('low',left<=300);
      if(left<=0){clearInterval(timer); doSubmit();}
    },1000);
    $('clock').textContent=fmt(left);
    renderQ();
    window.scrollTo(0,0);
  }

  function renderQ(){
    var q=cur.questions[pos];
    var wrap=$('qwrap');
    var tag=q.subject==='ee'?'<span class="tag ee">电路</span>':'<span class="tag">数学</span>';
    var flagBtn='<button class="btn line" id="flagBtn" style="padding:5px 10px;font-size:12px;margin-left:auto">'+(flags[pos]?'已标记':'标记')+'</button>';
    var h='<div class="qh">'+tag+'<span>第 '+(pos+1)+' / '+cur.total+' 题</span><span>'+q.module+'</span>'+flagBtn+'</div>';
    h+='<div class="stem">'+q.stem+'</div>';
    q.opts.forEach(function(o,i){
      var L='ABCD'[i], sel=answers[pos]===L?' sel':'';
      h+='<label class="opt'+sel+'" data-l="'+L+'"><span class="k">'+L+'</span><span>'+cleanOpt(o)+'</span></label>';
    });
    wrap.innerHTML=h;
    wrap.querySelectorAll('label.opt').forEach(function(lb){
      lb.addEventListener('click',function(){
        if(submitted)return;
        answers[pos]=lb.getAttribute('data-l');
        wrap.querySelectorAll('label.opt').forEach(function(x){x.classList.remove('sel');});
        lb.classList.add('sel');
        updateProg();
      });
    });
    $('flagBtn').onclick=function(){ flags[pos]=!flags[pos]; renderQ(); };
    $('prevBtn').disabled=pos===0;
    $('nextBtn').textContent=pos===cur.total-1?'检查 / 交卷':'下一题';
    updateProg();
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();
    window.scrollTo(0,0);
  }

  function updateProg(){
    var answered=Object.keys(answers).length;
    $('hProg').textContent='已答 '+answered+'/'+cur.total;
    $('hBar').style.width=Math.round(answered/cur.total*100)+'%';
  }

  $('prevBtn').onclick=function(){ if(pos>0){pos--;renderQ();} };
  $('nextBtn').onclick=function(){
    if(pos<cur.total-1){pos++;renderQ();}
    else askSubmit();
  };
  $('paletteBtn').onclick=function(){
    var g=$('grid'); g.innerHTML='';
    cur.questions.forEach(function(_,i){
      var b=document.createElement('button');
      b.className='n'+(answers[i]?' ans':'')+(flags[i]?' flag':'')+(i===pos?' cur':'');
      b.textContent=i+1;
      b.onclick=function(){pos=i;$('sheet').classList.remove('on');renderQ();};
      g.appendChild(b);
    });
    $('sheet').classList.add('on');
  };
  $('closeSheet').onclick=function(){$('sheet').classList.remove('on');};
  $('sheet').onclick=function(e){if(e.target===$('sheet'))$('sheet').classList.remove('on');};

  function askSubmit(){
    var un=cur.total-Object.keys(answers).length;
    $('mBody').textContent=un>0?('还有 '+un+' 题没答，交卷后不能再改。'):'全部已作答，交卷后立即判分。';
    $('modal').classList.add('on');
  }
  $('mCancel').onclick=function(){$('modal').classList.remove('on');};
  $('mOk').onclick=function(){$('modal').classList.remove('on');doSubmit();};

  function doSubmit(){
    if(submitted)return; submitted=true;
    if(timer)clearInterval(timer);
    var right=0, wrong=[];
    cur.questions.forEach(function(q,i){
      var got=answers[i];
      if(got===q.answer)right++; else wrong.push({i:i,q:q,got:got});
    });
    var score=Math.round(right*cur.perScore*10)/10;
    var d=new Date(), ds=d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
    cfg.history=cfg.history||[];
    cfg.history.push({date:ds,title:cur.title,score:score,right:right,total:cur.total});
    if(cfg.history.length>30)cfg.history=cfg.history.slice(-30);
    save();

    $('runner').classList.add('hidden'); $('hdr').classList.add('hidden'); $('bar').classList.add('hidden');
    var r=$('result'); r.classList.remove('hidden'); $('tab').classList.remove('hidden');
    var pass=score>=60, cls=pass?'var(--ok)':'var(--bad)';
    var h='<div class="card"><h2>交卷结果</h2><div class="score" style="color:'+cls+'">'+score+'</div>'+
      '<div class="meta" style="text-align:center">'+cur.title+'</div>'+
      '<div class="res"><div><span>正确</span><b>'+right+'/'+cur.total+'</b></div>'+
      '<div><span>正确率</span><b>'+Math.round(right/cur.total*100)+'%</b></div>'+
      '<div><span>用时</span><b>'+fmt(cur.minutes*60-Math.max(0,left))+'</b></div></div>'+
      '<p class="meta" style="text-align:center">'+(pass?'达标 ✓（60 分为线；周测建议 70+，预测卷 65+）':'未达 60 分线，下一周把时间挪给错题')+'</p></div>';

    if(wrong.length){
      h+='<div class="card"><h2>错题（'+wrong.length+'）· 点开看解析</h2>';
      wrong.forEach(function(w){
        h+='<div class="wrongrow"><span>第 '+(w.i+1)+' 题 · 正确 <b>'+w.q.answer+'</b>'+(w.got?' / 你选 '+w.got:' / 未答')+'</span><button class="btn line" data-i="'+w.i+'" style="padding:6px 12px;font-size:12.5px">解析</button></div>';
      });
      h+='</div>';
    }
    h+='<div class="card"><div class="res" style="grid-template-columns:1fr 1fr">'+
       (wrong.length?'<button class="btn" id="retryWrong">只练错题（'+wrong.length+'）</button>':'<div></div>')+
       '<button class="btn ghost" id="again">再考一次</button></div>'+
       '<a class="btn wide line" href="plan.html" style="margin-top:8px">回到打卡页</a></div>';
    r.innerHTML=h;
    r.querySelectorAll('button[data-i]').forEach(function(b){
      b.onclick=function(){
        pos=+b.getAttribute('data-i');
        $('result').classList.add('hidden'); $('runner').classList.remove('hidden');
        $('hdr').classList.remove('hidden'); $('bar').classList.remove('hidden');
        submitted=true;
        renderReview();
      };
    });
    var rw=$('retryWrong');
    if(rw) rw.onclick=function(){ start(cur.id.replace('-retry',''), wrong.map(function(w){return w.i;})); };
    $('again').onclick=function(){ start(cur.id.replace('-retry',''), null); };
    window.scrollTo(0,0);
  }

  function renderReview(){
    var q=cur.questions[pos], got=answers[pos];
    var wrap=$('qwrap');
    var tag=q.subject==='ee'?'<span class="tag ee">电路</span>':'<span class="tag">数学</span>';
    var h='<div class="qh">'+tag+'<span>第 '+(pos+1)+' / '+cur.total+' 题</span><span>'+q.module+'</span></div>';
    h+='<div class="stem">'+q.stem+'</div>';
    q.opts.forEach(function(o,i){
      var L='ABCD'[i], cls='';
      if(L===q.answer)cls=' right'; else if(L===got)cls=' wrong';
      h+='<label class="opt'+cls+'"><span class="k">'+L+'</span><span>'+cleanOpt(o)+'</span></label>';
    });
    var txt=(q.solution||[]).map(function(s){return '<p>'+s+'</p>';}).join('');
    h+='<div class="sol"><p><b>正确答案：'+q.answer+'</b>'+(got?'（你选 '+got+'）':'（未作答）')+'</p>'+(txt||'<p>见刷题站原题</p>')+'</div>';
    wrap.innerHTML=h;
    $('prevBtn').disabled=pos===0;
    $('nextBtn').textContent=pos===cur.total-1?'返回结果':'下一题';
    $('nextBtn').onclick=function(){ if(pos<cur.total-1){pos++;renderReview();} else backToResult(); };
    $('prevBtn').onclick=function(){ if(pos>0){pos--;renderReview();} };
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();
    window.scrollTo(0,0);
  }
  function backToResult(){
    $('runner').classList.add('hidden'); $('result').classList.remove('hidden');
    $('hdr').classList.add('hidden'); $('bar').classList.add('hidden');
    window.scrollTo(0,0);
  }
  $('paletteBtn').onclick=function(){
    var g=$('grid'); g.innerHTML='';
    cur.questions.forEach(function(_,i){
      var b=document.createElement('button');
      b.className='n'+(answers[i]?' ans':'')+(flags[i]?' flag':'')+(i===pos?' cur':'');
      b.textContent=i+1; b.onclick=function(){pos=i;$('sheet').classList.remove('on'); submitted?renderReview():renderQ();};
      g.appendChild(b);
    });
    $('sheet').classList.add('on');
  };
})();
</script></body></html>
